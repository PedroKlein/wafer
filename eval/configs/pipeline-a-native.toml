# Pipeline A (native baseline): MQTT source → native threshold-filter → MQTT sink.
#
# RFC-008 §D5 Layer-1 baseline: same topology + channels as Pipeline A
# WAFER (pipeline-a-wafer.toml), same JSON-decode + range-compare work as
# the eKuiper comparator, but no Wasm boundary. Closes A18: the native
# filter dispatch is wired through `plugin.kind = "native"` +
# `function = "threshold"`, using the WIT-plugin-equivalent
# `NativeFilter::range` factory. Semantics stay in lockstep with
# `plugins/threshold-filter` per `tests/native_threshold_filter.rs`.

[pipeline]
name = "pipeline-a-native"
description = "Pipeline A native baseline: MQTT → threshold-filter (native) → MQTT"

[nodes.mqtt-in]
type = "source"
kind = "mqtt"
broker = "localhost"
port = 1883
topic = "wafer/telemetry"
qos = 1
client_id = "wafer-pipeline-a-in"

[nodes.filter]
type = "filter"
plugin = { kind = "native", function = "threshold" }

[nodes.filter.config]
field = "temperature"
min = 50.0
max = 99999.0

[nodes.mqtt-out]
type = "sink"
kind = "mqtt"
broker = "localhost"
port = 1883
topic = "wafer/telemetry/hot"
qos = 1
client_id = "wafer-pipeline-a-out"

[[edges]]
from = "mqtt-in"
to = "filter"

[[edges]]
from = "filter"
to = "mqtt-out"
