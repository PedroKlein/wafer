# E-Swap-1/2/6 pipeline: bench-source → pass-through-v1 (Wasm) → bench-sink.
#
# API enabled for HTTP-triggered hot-swaps. BenchSink tracks sequences AND
# hot-swap transitions (both needed for E-Swap-1 pause measurement and
# E-Swap-2 zero-loss verification). 150s total at 1000 msg/s: 30s
# warmup followed by a 120s measurement window.

[pipeline]
name = "e-swap-hotswap"
description = "Hotswap shakedown: pass-through-v1 → repeated v1/v2 swaps via API"

[engine]
epoch_deadline = 100
epoch_tick_ms = 10

[engine.fuel]
transform = 10000000
filter = 500000
router = 500000

[nodes.source]
type = "source"
kind = "bench-source"
rate = 1000.0
total_messages = 150000
warmup_messages = 30000
payload_size = 128

[nodes.transform]
type = "transform"
plugin = "../../../plugins/pass-through-v1/target/wasm32-wasip2/release/wafer_pass_through_v1.wasm"

[nodes.sink]
type = "sink"
kind = "bench-sink"
warmup_secs = 30
track_sequences = true
track_hotswap = true

[api]
enabled = true
bind = "127.0.0.1:9090"

[metrics]
enabled = true

[[edges]]
from = "source"
to = "transform"

[[edges]]
from = "transform"
to = "sink"
