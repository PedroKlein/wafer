openapi: 3.1.0
info:
  title: WAFER Control Plane API
  version: 0.1.0
  description: HTTP control plane implemented by crates/wafer-core/src/api/server.rs.
servers:
  - url: http://127.0.0.1:9090
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      operationId: ready
      responses:
        "200":
          description: Pipeline is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Pipeline is not running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
  /metrics:
    get:
      operationId: metrics
      responses:
        "200":
          description: Prometheus text exposition.
          content:
            text/plain:
              schema:
                type: string
  /api/v1/nodes:
    get:
      operationId: listNodes
      responses:
        "200":
          description: All configured nodes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NodeInfo"
  /api/v1/nodes/{id}:
    get:
      operationId: getNode
      parameters:
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: Node state and counters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeInfo"
        "404":
          $ref: "#/components/responses/TextError"
  /api/v1/nodes/{id}/hot-swap:
    post:
      operationId: hotSwap
      description: Replaces an eligible loaded Wasm node between messages and reports runner-local adoption or rollback. This response is not sink-convergence evidence.
      parameters:
        - $ref: "#/components/parameters/NodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HotSwapRequest"
      responses:
        "200":
          description: Replacement adopted with a first runner-local outcome, or rolled back.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReplacementResult"
                  - $ref: "#/components/schemas/RollbackResult"
        "400":
          $ref: "#/components/responses/TextError"
        "404":
          $ref: "#/components/responses/TextError"
        "409":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"
        "504":
          $ref: "#/components/responses/TextError"
  /api/v1/nodes/{id}/reconfigure:
    post:
      operationId: reconfigure
      description: Re-instantiates an eligible loaded Wasm node from its cached component with new JSON configuration.
      parameters:
        - $ref: "#/components/parameters/NodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReconfigureRequest"
      responses:
        "200":
          description: Reconfiguration adopted with a first runner-local outcome, or rolled back.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReplacementResult"
                  - $ref: "#/components/schemas/RollbackResult"
        "404":
          $ref: "#/components/responses/TextError"
        "409":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/TextError"
        "504":
          $ref: "#/components/responses/TextError"
  /api/v1/pipeline/shutdown:
    post:
      operationId: shutdown
      responses:
        "200":
          description: Cancellation signalled.
components:
  parameters:
    NodeId:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    TextError:
      description: Plain-text error returned by the current handler.
      content:
        text/plain:
          schema:
            type: string
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadyResponse:
      type: object
      required: [ready]
      properties:
        ready:
          type: boolean
        reason:
          type: string
    NodeInfo:
      type: object
      required: [id, state, processed, failed, replacement_eligible]
      properties:
        id:
          type: string
        state:
          type: string
        processed:
          type: integer
          format: uint64
        failed:
          type: integer
          format: uint64
        replacement_eligible:
          type: boolean
          description: True only for a loaded Wasm Transform, Filter, or Router.
    HotSwapRequest:
      type: object
      required: [wasm_path]
      properties:
        wasm_path:
          type: string
    ReconfigureRequest:
      type: object
      required: [config]
      properties:
        config: {}
        expected_plugin_hash:
          type: string
    LocalOutcome:
      type: object
      required: [disposition, after_adoption_ns]
      properties:
        disposition:
          type: string
          enum: [forwarded-enqueued, filter-dropped, router-no-route]
        after_adoption_ns:
          type: integer
          format: uint64
    ReplacementTimeline:
      type: object
      required: [compile_ns, instantiate_ns, signal_ns, replacement_adopted_ns, first_post_replacement_local_outcome_ns]
      properties:
        compile_ns:
          type: integer
          format: uint64
        instantiate_ns:
          type: integer
          format: uint64
        signal_ns:
          type: integer
          format: uint64
        replacement_adopted_ns:
          type: integer
          format: uint64
        first_post_replacement_local_outcome_ns:
          type: integer
          format: uint64
    ReplacementResult:
      type: object
      required: [node_id, replacement_adopted, first_post_replacement_local_outcome, timeline]
      properties:
        node_id:
          type: string
        replacement_adopted:
          type: boolean
          const: true
        first_post_replacement_local_outcome:
          $ref: "#/components/schemas/LocalOutcome"
        timeline:
          $ref: "#/components/schemas/ReplacementTimeline"
    RollbackResult:
      type: object
      required: [node_id, status, reason, timeline]
      properties:
        node_id:
          type: string
        status:
          type: string
          const: rolled_back
        reason:
          type: string
        timeline:
          type: object
          required: [rollback_ns]
          properties:
            compile_ns:
              type: integer
              format: uint64
            instantiate_ns:
              type: integer
              format: uint64
            signal_ns:
              type: integer
              format: uint64
            rollback_ns:
              type: integer
              format: uint64
