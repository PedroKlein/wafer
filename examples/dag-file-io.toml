# file source -> pass-through -> file sink
# Build first: mise run //plugins:build-plugin pass-through

[engine]
default_queue_capacity = 1024

[dead_letter]
kind = "file"
path = "dlq.jsonl"

[nodes.source]
type = "source"
kind = "file"
path = "/tmp/wafer-input.txt"

[nodes.passthrough]
type = "transform"
plugin = "../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.sink]
type = "sink"
kind = "file"
path = "/tmp/wafer-output.txt"
append = true

[[edges]]
from = "source"
to = "passthrough"

[[edges]]
from = "passthrough"
to = "sink"
