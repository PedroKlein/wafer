name: cross-arch

# Builds wafer, wafer-loadgen and waferctl for aarch64-unknown-linux-gnu on
# every push to main and every PR that touches Rust code, so the Raspberry Pi
# build cannot regress silently. See docs/eval/cross-compile.md.
#
# Runs on a native arm64 runner (`ubuntu-24.04-arm`) with a cached cargo
# target. The local `mise run cross-build-pi` task keeps the Docker recipe for
# hosts without an arm64 toolchain; CI no longer emulates arm64 with QEMU,
# which made a cold release build take most of the 45-minute budget.
#
# Non-gating: not a required check on `main`.

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "mise.toml"
      - "crates/**"
      - ".github/workflows/cross-arch.yml"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "mise.toml"
      - "crates/**"
      - ".github/workflows/cross-arch.yml"
  workflow_dispatch: {}

concurrency:
  group: cross-arch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-build-pi:
    name: cross-build-pi (aarch64-unknown-linux-gnu)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain from rust-toolchain.toml
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: cross-arch-aarch64

      - name: Build wafer, wafer-loadgen, waferctl (aarch64-linux)
        run: cargo build --locked --release -p wafer-runtime -p wafer-loadgen -p waferctl

      - name: Verify outputs are ARM aarch64 ELF binaries
        run: |
          for b in wafer wafer-loadgen waferctl; do
            f=target/release/$b
            file "$f"
            file "$f" | grep -q "ARM aarch64"
            echo "  $b: $(du -h "$f" | cut -f1)"
          done

      - name: Upload aarch64-linux binaries as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wafer-aarch64-linux-${{ github.sha }}
          path: |
            target/release/wafer
            target/release/wafer-loadgen
            target/release/waferctl
          if-no-files-found: error
          retention-days: 14
