[package]
name = "filter-transform"
version = "0.1.0"
edition = "2021"
description = "Filter transform plugin for WAFER pipeline - drops messages matching a pattern"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.53"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[profile.release]
opt-level = "s"
lto = true
