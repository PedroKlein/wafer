# Passthrough with epoch metering only (fuel disabled).
#
# Ablation for E-Perf-7 metering-overhead decomposition. Fuel is set to 0
# for all node categories; the runtime interpretation of `fuel = 0` will be
# dialed in by P2.3 (E-Perf-7 execute).

[pipeline]
name = "bench-passthrough-epoch-only"
description = "Passthrough with epoch metering only (fuel disabled)"

[engine.fuel]
transform = 0
filter = 0
router = 0

[nodes.source]
type = "source"
kind = "bench-source"
rate = 1000.0
total_messages = 60000
warmup_messages = 30000
payload_size = 128

[nodes.transform]
type = "transform"
plugin = "../../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.sink]
type = "sink"
kind = "bench-sink"
warmup_secs = 30
track_sequences = true

[[edges]]
from = "source"
to = "transform"

[[edges]]
from = "transform"
to = "sink"
