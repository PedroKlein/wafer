[package]
name = "wafer-core"
description = "WAFER - WebAssembly Flow Execution Runtime: Core library"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
http-api = ["axum", "tower-http", "prometheus-client", "sysinfo"]
# Enable CUDA for GPU acceleration on NVIDIA devices (e.g., Jetson)
# Requires CUDA toolkit installed on the target system
cuda = ["wasmtime-wasi-nn/onnx-cuda"]
# Legacy test support — enables old runner/orchestrator tests from Phase 2
phase2-tests = []
# Enables integration tests that require pre-built .wasm plugin artifacts
integration-tests = []

[dependencies]
wafer-types = { workspace = true }

# Graph
petgraph = { workspace = true }

# WASM runtime
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
wasmtime-wasi-nn = { workspace = true }
ort = { version = "2.0.0-rc.10", features = ["download-binaries"] }

# Async runtime
tokio = { workspace = true }
tokio-util = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging/tracing
tracing = { workspace = true }

# HTTP (feature-gated)
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
prometheus-client = { workspace = true, optional = true }
sysinfo = { workspace = true, optional = true }

# Misc
uuid = { workspace = true }
bytes = { workspace = true }
blake3 = { workspace = true }
foldhash = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
oci-client = { workspace = true }
semver = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
dirs = { workspace = true }
futures-util = { workspace = true }
docker_credential = "1.3.2"
rumqttc = "0.25"
base64 = "0.22.1"

# HTTP source/sink
hyper = { version = "1.0", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
hyper = { version = "1.0", features = ["client"] }
criterion = { version = "0.5", features = ["async_tokio"] }

[lints]
workspace = true

[[bench]]
name = "hot_swap"
harness = false

[[bench]]
name = "metrics"
harness = false
required-features = ["http-api"]

[[bench]]
name = "throughput"
harness = false
