# stdin -> threshold filter -> stdout
# Build first: mise run //plugins:build-plugin threshold-filter
# Run: printf '%s\n' '{"temperature":72}' '{"temperature":20}' | cargo run -p wafer-runtime -- --config examples/dag-filter.toml

[engine]
default_queue_capacity = 1024

[nodes.source]
type = "source"
kind = "stdin"

[nodes.filter]
type = "filter"
plugin = "../plugins/threshold-filter/target/wasm32-wasip2/release/wafer_threshold_filter.wasm"

[nodes.filter.config]
field = "temperature"
min = 50.0
max = 100.0

[nodes.sink]
type = "sink"
kind = "stdout"

[[edges]]
from = "source"
to = "filter"

[[edges]]
from = "filter"
to = "sink"
