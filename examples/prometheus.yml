# Prometheus scrape configuration for a local WAFER runtime.
#
# WAFER serves /metrics on its API port (127.0.0.1:9090 by default), which is
# also Prometheus's default port. This config therefore expects WAFER's
# metrics on a separate port and runs Prometheus on 9092.
#
# 1. Build the pass-through plugin, then start WAFER with a separate metrics
#    listener:
#      plugins/build-plugins.sh pass-through
#      cargo run -p wafer-runtime -- --config examples/dag-passthrough-with-api.toml \
#        --metrics-bind 127.0.0.1:9091
#
# 2. Start Prometheus with this config:
#      prometheus --config.file=examples/prometheus.yml --web.listen-address=:9092
#    or with Docker:
#      docker run -d --name prometheus --network host \
#        -v "$(pwd)/examples/prometheus.yml:/etc/prometheus/prometheus.yml" \
#        prom/prometheus --config.file=/etc/prometheus/prometheus.yml \
#        --web.listen-address=:9092
#
# 3. Check the target at http://localhost:9092/targets

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'wafer-monitor'

scrape_configs:
  - job_name: 'wafer'
    static_configs:
      - targets: ['localhost:9091']
        labels:
          instance: 'wafer-local'
    scrape_timeout: 10s
    metrics_path: /metrics
    honor_labels: true
