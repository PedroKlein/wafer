# WAFER load profile: 100 KiB deterministic payload for MQTT load runs.
# WAFER's MQTT source keeps rumqttc's 10 KiB packet limit and cannot receive it.
#
# Rendered by `wafer_loadgen::PayloadTemplate::Generic100kb`. Schema is
# telemetry + a `pad` field of BLAKE3-derived hex. Deterministic across runs.
#
# SHA-256 of the canonical rendering: 770ce4bf5ecf4bf2a6474149f19cf3458368701239ff84d125edad96aa0ab41b
# Total byte length: 102_400 bytes exact at any (ts, seq).

[loadgen]
rate = 1000
duration_secs = 60
warmup_secs = 30
topic = "wafer/bench/input"
payload_template = "generic-100kb"
profile = "steady"
