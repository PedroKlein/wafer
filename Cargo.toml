[package]
name = "wafer-poc"
version = "0.1.0"
edition = "2021"
authors = ["Pedro Klein <pedroklein1@hotmail.com>"]
description = "WAFER - WebAssembly Flow Execution Runtime: A DAG pipeline runtime for WebAssembly plugins"
repository = "https://github.com/PedroKlein/wafer-poc"
license = "MIT OR Apache-2.0"
keywords = ["wasm", "webassembly", "pipeline", "dag", "runtime"]
categories = ["wasm", "data-structures"]
readme = "README.md"
rust-version = "1.75"

[workspace]
members = ["."]
exclude = ["plugins/pass-through"]

[workspace.dependencies]
petgraph = "0.8"
# NOTE: Using git revision for wasmtime because wasmtime-wasi-nn 41.0.3 on crates.io
# has a bug with the ort (ONNX Runtime) crate API - "no method named 'context' found".
# This revision contains the fix. Can switch back to crates.io when wasmtime 42.x releases.
wasmtime = { git = "https://github.com/bytecodealliance/wasmtime", rev = "456310751e355b9fb0aea533c6d04be3b07d32b7" }
wasmtime-wasi = { git = "https://github.com/bytecodealliance/wasmtime", rev = "456310751e355b9fb0aea533c6d04be3b07d32b7" }
wasmtime-wasi-nn = { git = "https://github.com/bytecodealliance/wasmtime", rev = "456310751e355b9fb0aea533c6d04be3b07d32b7", features = ["onnx"] }
tokio = { version = "1", features = ["rt", "macros", "io-std", "sync", "time", "signal"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
anyhow = "1"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
wasm-pkg-client = "0.15"
semver = "1"
sha2 = "0.10"
hex = "0.4"
dirs = "6"
futures-util = "0.3"

[dependencies]
petgraph.workspace = true
wasmtime.workspace = true
wasmtime-wasi.workspace = true
wasmtime-wasi-nn.workspace = true
ort = { version = "2.0.0-rc.10", features = ["download-binaries"] }
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
thiserror.workspace = true
anyhow.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
uuid.workspace = true
wasm-pkg-client.workspace = true
semver.workspace = true
sha2.workspace = true
hex.workspace = true
dirs.workspace = true
futures-util.workspace = true

[dev-dependencies]
tempfile.workspace = true
serde_json = "1"

[patch.crates-io]
# NOTE: ort version must match what wasmtime-wasi-nn expects. Cannot upgrade independently.
ort = { git = "https://github.com/pykeio/ort", tag = "v2.0.0-rc.10" }
