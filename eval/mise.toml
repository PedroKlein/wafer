# Evaluation plugin build, result housekeeping and analysis notebooks.
#
# Tasks default to cwd = eval/ (this config_root). Invocation from repo root:
# `mise run //eval:notebooks`; from inside eval/: `mise run :notebooks`.
# The experiments themselves run through the canonical runner:
# `mise run plan-canonical-pi5` / `mise run run-canonical-pi5` (root mise.toml).

[tasks.build-plugins-eval]
description = "Build the four plugins consumed by the E-* experiments"
run = "../plugins/build-plugins.sh pass-through uppercase threshold-filter threshold-filter-v2"

[tasks.eval-clean]
description = "Remove every timestamped result tree under eval/results/"
run = "rm -rf results/*/"

# =============================================================================
# Analysis notebooks + thesis figures
# =============================================================================

[tasks.notebooks-install-filter]
description = "Install the pinned nbstripout Git filter in this checkout"
dir = "{{config_root}}/analysis"
run = '''
python=$(uv run --frozen python -c 'import sys; print(sys.executable)')
git config filter.nbstripout.clean "\"$python\" -m nbstripout --keep-id"
git config filter.nbstripout.smudge cat
git config filter.nbstripout.required true
git config diff.ipynb.textconv "\"$python\" -m nbstripout --keep-id -t"
'''

[tasks.notebooks-format]
description = "Strip outputs and normalize tracked analysis notebooks"
dir = "{{config_root}}/analysis"
run = "uv run --frozen nbstripout --keep-id notebooks/*.ipynb"

[tasks.notebooks-check]
description = "Fail if tracked analysis notebooks are not nbstripout-normalized"
dir = "{{config_root}}/analysis"
run = "uv run --frozen nbstripout --keep-id --verify notebooks/*.ipynb"

[tasks.notebooks]
description = "Open all analysis notebooks in JupyterLab (browser)"
dir = "{{config_root}}/analysis"
run = "uv run jupyter lab --notebook-dir=notebooks"

[tasks.notebooks-view]
description = "Open a specific notebook read-only: mise run //eval:notebooks-view <stem>"
dir = "{{config_root}}/analysis"
run = '''
set -euo pipefail
if [ -z "${1:-}" ]; then
  echo "usage: mise run //eval:notebooks-view <notebook-stem>" >&2
  echo "  e.g. mise run //eval:notebooks-view 05-hotswap-timeline" >&2
  echo "  available:" >&2
  ls notebooks/*.ipynb | xargs -n1 basename | sed 's/\.ipynb$//; s/^/    /' >&2
  exit 2
fi
out=$(mktemp -d)/$1.html
uv run jupyter nbconvert --to html --output-dir "$(dirname "$out")" "notebooks/$1.ipynb"
open "$out"
'''

[tasks.notebooks-execute]
description = "Re-execute all analysis notebooks against fresh eval/results/ data"
dir = "{{config_root}}/analysis"
run = '''
set -euo pipefail
for nb in notebooks/*.ipynb; do
  echo "=== executing $(basename "$nb") ==="
  uv run jupyter nbconvert --to notebook --execute --inplace "$nb"
done
'''

[tasks.figures]
description = "Execute the notebooks and write the thesis figures and tables under eval/analysis/figures/: mise run //eval:figures [batch-id]"
dir = "{{config_root}}/analysis"
run = '''
set -euo pipefail
export WAFER_ANALYSIS_OUTPUT_DIR="$PWD/figures"
if [ -n "${1:-}" ]; then export WAFER_EVAL_BATCH_ID="$1"; fi
for nb in notebooks/*.ipynb; do
  echo "=== executing $(basename "$nb") ==="
  uv run jupyter nbconvert --to notebook --execute --inplace "$nb"
done
find figures -name '*.pdf' | sort
'''
