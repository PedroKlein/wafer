# MQTT source -> pass-through -> MQTT sink
# Build first: mise run //plugins:build-plugin pass-through

[engine]
default_queue_capacity = 1024

[nodes.mqtt-source]
type = "source"
kind = "mqtt"
broker = "localhost"
port = 1883
topic = "input/messages"
qos = 1
client_id = "wafer-source"

[nodes.transform]
type = "transform"
plugin = "../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.mqtt-sink]
type = "sink"
kind = "mqtt"
broker = "localhost"
port = 1883
topic = "output/processed"
qos = 1
client_id = "wafer-sink"

[[edges]]
from = "mqtt-source"
to = "transform"

[[edges]]
from = "transform"
to = "mqtt-sink"
