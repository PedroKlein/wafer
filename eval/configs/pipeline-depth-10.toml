# 10-hop pipeline: bench-source → 10× pass-through → bench-sink.
# Depth-scaling series for E-Perf-6 (memory) and E-Perf-8 (latency).

[pipeline]
name = "bench-depth-10"
description = "10 pass-through transforms between bench source and bench sink"

[nodes.source]
type = "source"
kind = "bench-source"
rate = 1000.0
total_messages = 60000
warmup_messages = 30000
payload_size = 128

[nodes.t1]
type = "transform"
plugin = "../../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.t2]
type = "transform"
plugin = "../../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.t3]
type = "transform"
plugin = "../../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.t4]
type = "transform"
plugin = "../../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.t5]
type = "transform"
plugin = "../../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.t6]
type = "transform"
plugin = "../../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.t7]
type = "transform"
plugin = "../../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.t8]
type = "transform"
plugin = "../../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.t9]
type = "transform"
plugin = "../../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.t10]
type = "transform"
plugin = "../../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.sink]
type = "sink"
kind = "bench-sink"
warmup_secs = 30
track_sequences = true

[[edges]]
from = "source"
to = "t1"

[[edges]]
from = "t1"
to = "t2"

[[edges]]
from = "t2"
to = "t3"

[[edges]]
from = "t3"
to = "t4"

[[edges]]
from = "t4"
to = "t5"

[[edges]]
from = "t5"
to = "t6"

[[edges]]
from = "t6"
to = "t7"

[[edges]]
from = "t7"
to = "t8"

[[edges]]
from = "t8"
to = "t9"

[[edges]]
from = "t9"
to = "t10"

[[edges]]
from = "t10"
to = "sink"
