# HTTP source -> pass-through -> HTTP sink
# Build first: mise run //plugins:build-plugin pass-through
# Run: cargo run -p wafer-runtime -- --config examples/dag-http.toml

[engine]
default_queue_capacity = 1024

[nodes.http-source]
type = "source"
kind = "http"
bind = "127.0.0.1:8081"
path = "/ingest"

[nodes.transform]
type = "transform"
plugin = "../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.http-sink]
type = "sink"
kind = "http"
url = "http://127.0.0.1:8082/webhook"
method = "POST"

[[edges]]
from = "http-source"
to = "transform"

[[edges]]
from = "transform"
to = "http-sink"
