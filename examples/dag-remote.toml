# stdin -> OCI-hosted uppercase -> stdout
# This example parses and validates locally; execution requires the referenced artifact.

[registry]
cache_dir = "/tmp/wafer-oci-cache"

[nodes.source]
type = "source"
kind = "stdin"

[nodes.uppercase]
type = "transform"
plugin = "registry.example.com/example/wafer-uppercase:1.0.0"

[nodes.sink]
type = "sink"
kind = "stdout"

[[edges]]
from = "source"
to = "uppercase"

[[edges]]
from = "uppercase"
to = "sink"
