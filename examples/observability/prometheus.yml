# Prometheus configuration for WAFER observability stack
#
# This config is used by docker-compose.yml and scrapes metrics from
# WAFER running on the host machine.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'wafer-dev'

scrape_configs:
  # WAFER runtime metrics
  # Uses host.docker.internal to reach WAFER on the host machine
  - job_name: 'wafer'
    static_configs:
      - targets: ['host.docker.internal:9091']
        labels:
          instance: 'wafer-local'
          environment: 'development'
    scrape_timeout: 10s
    metrics_path: /metrics
    honor_labels: true

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
