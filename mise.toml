# WAFER project tools and tasks
#
# mise is the primary developer entrypoint for this repository: it installs
# non-Rust helper tools and runs project tasks. The legacy `justfile`
# was removed 2026-08-02 after task-parity with mise was verified
# (ADR-0015 follow-up).
# temporary compatibility layer while docs and scripts finish migrating.
#
# Rust stays authoritative in rust-toolchain.toml. Install rustup/Rust before
# `mise install`; cargo-based mise tools such as wasm-tools and wkg require
# `cargo` to exist. Keeping Rust out of mise avoids double-managing rustc while
# preserving rust-toolchain.toml as the single Rust source of truth.

[tools]
# Non-Rust language/tooling surface.
python = "3.11"
uv = "latest"
go = "1.24"

# WebAssembly Component Model and OCI plugin tooling.
"cargo:wasm-tools" = "latest"
"cargo:wkg" = "latest"
tinygo = "latest"
"pipx:componentize-py" = "latest"

# Local quality/security helpers.
"cargo:cargo-deny" = "latest"
"cargo:cargo-audit" = "latest"
"cargo:taplo-cli" = "latest"
"cargo:typos-cli" = "latest"

[tasks.setup]
description = "Verify Rust prerequisite, then install mise-managed helper tools"
run = '''
if ! command -v rustup >/dev/null 2>&1; then
  echo "error: rustup is required before mise can install cargo-based tools" >&2
  echo "install Rust from https://rustup.rs/, then rerun: mise run setup" >&2
  exit 1
fi

if ! command -v cargo >/dev/null 2>&1; then
  echo "error: cargo is required before mise can install cargo-based tools" >&2
  echo "install Rust from https://rustup.rs/, then rerun: mise run setup" >&2
  exit 1
fi

rustup show active-toolchain
rustup target add wasm32-wasip2
mise install
'''

[tasks.tool-versions]
description = "Print versions for the primary development tools"
run = '''
rustc --version
cargo --version
python --version
uv --version
wasm-tools --version
wkg --version || true
tinygo version || true
if command -v jq >/dev/null 2>&1; then jq --version; fi
'''

[tasks.default]
description = "List available project tasks"
run = "mise tasks ls"

[tasks.tasks]
description = "List available project tasks"
run = "mise tasks ls"

# =============================================================================
# Core Workspace Commands
# =============================================================================

[tasks.build]
description = "Build the entire workspace"
run = "cargo build --workspace"

[tasks.build-release]
description = "Build the entire workspace in release mode"
run = "cargo build --workspace --release"

[tasks.test]
description = "Run all tests across the workspace"
run = "cargo test --workspace"

[tasks.check]
description = "Check code without building"
run = "cargo check --workspace"

[tasks.clean]
description = "Clean workspace and plugin build artifacts"
run = '''
cargo clean
for plugin in plugins/*/Cargo.toml; do
  cargo clean --manifest-path "$plugin" 2>/dev/null || true
done
'''

[tasks.fmt]
description = "Format Rust code"
run = "cargo fmt --all"

[tasks.clippy]
description = "Run clippy lints"
run = "cargo clippy --workspace --all-targets --all-features"

# =============================================================================
# Binary-specific Commands
# =============================================================================

[tasks.build-runtime]
description = "Build wafer-runtime only"
run = "cargo build -p wafer-runtime"

[tasks.build-ctl]
description = "Build waferctl only"
run = "cargo build -p waferctl"

[tasks.run]
description = "Run wafer-runtime with an optional config path"
run = '''
bash -c '
set -euo pipefail
config=${1:-examples/dag-passthrough.toml}
cargo run -p wafer-runtime -- --config "$config"
' --
'''

[tasks.ctl]
description = "Run waferctl with passthrough arguments"
run = '''
bash -c '
set -euo pipefail
cargo run -p waferctl -- "$@"
' --
'''

# =============================================================================
# Plugin Build Commands
# =============================================================================

[tasks.plugin]
description = "Build the pass-through plugin"
run = "cargo build --release --manifest-path plugins/pass-through/Cargo.toml --target wasm32-wasip2"

[tasks.validate]
description = "Validate the pass-through plugin WASM component"
depends = ["plugin"]
run = "wasm-tools validate --features component-model plugins/pass-through/target/wasm32-wasip2/release/pass_through_transform.wasm"

[tasks.build-plugins]
description = "Build all plugins for wasm32-wasip2"
run = '''
for plugin in plugins/*/Cargo.toml; do
  name=$(basename "$(dirname "$plugin")")
  echo "Building plugin: $name"
  cargo build --release --manifest-path "$plugin" --target wasm32-wasip2
done
'''

[tasks.build-plugin]
description = "Build one plugin for wasm32-wasip2: mise run build-plugin <name>"
run = '''
bash -c '
set -euo pipefail
if [ $# -ne 1 ]; then
  echo "usage: mise run build-plugin <name>" >&2
  exit 2
fi
cargo build --release --manifest-path "plugins/$1/Cargo.toml" --target wasm32-wasip2
' --
'''

# =============================================================================
# OCI Registry Commands
# =============================================================================

[tasks.list-plugins]
description = "List built plugins and WASM file sizes"
run = '''
echo "Built plugins:"
for wasm in plugins/*/target/wasm32-wasip2/release/*.wasm; do
  if [ -f "$wasm" ]; then
    name=$(echo "$wasm" | sed 's|plugins/\([^/]*\)/.*|\1|')
    size=$(du -h "$wasm" | cut -f1)
    echo "  $name: $wasm ($size)"
  fi
done
'''

[tasks.install-wkg]
description = "Install the mise-managed wkg tool"
run = "mise install cargo:wkg"

[tasks.registry-login]
description = "Login to GitHub Container Registry: mise run registry-login <username> <token>"
quiet = true
run = '''
bash -c '
set -euo pipefail
if [ $# -ne 2 ]; then
  echo "usage: mise run registry-login <username> <token>" >&2
  exit 2
fi
username=$1
token=$2
echo "Logging into ghcr.io..."
printf "%s" "$token" | docker login ghcr.io -u "$username" --password-stdin
echo "✓ Logged in to ghcr.io as $username"
echo "Credentials stored in ~/.docker/config.json (used by wkg)"
' --
'''

[tasks.registry-status]
description = "Show current registry auth status"
run = '''
echo "Checking Docker credential store..."
docker-credential-osxkeychain list 2>/dev/null || docker-credential-desktop list 2>/dev/null || echo "No credential helper found"
echo ""
echo "Docker config location: ~/.docker/config.json"
grep -A2 "ghcr.io" ~/.docker/config.json 2>/dev/null || echo "No ghcr.io credentials found"
'''

[tasks.publish-plugin]
description = "Publish one plugin using Docker credentials: mise run publish-plugin <name> <version>"
run = '''
bash -c '
set -euo pipefail
if [ $# -ne 2 ]; then
  echo "usage: mise run publish-plugin <name> <version>" >&2
  exit 2
fi
name=$1
version=$2
case "$name" in
  pass-through)    wasm_file="pass_through_transform.wasm" ;;
  uppercase)       wasm_file="uppercase_transform.wasm" ;;
  filter)          wasm_file="filter_transform.wasm" ;;
  json-parse)      wasm_file="json_parse_transform.wasm" ;;
  tensor-prep)     wasm_file="tensor_prep.wasm" ;;
  result-format)   wasm_file="result_format.wasm" ;;
  mnist-inference) wasm_file="mnist_inference.wasm" ;;
  *)               wasm_file="${name}_transform.wasm" ;;
esac
wasm_path="plugins/$name/target/wasm32-wasip2/release/$wasm_file"
if [ ! -f "$wasm_path" ]; then
  echo "Error: WASM not found at $wasm_path" >&2
  echo "Run 'mise run build-plugin $name' first" >&2
  exit 1
fi
pkg_name=$(echo "$name" | tr '-' '_')
registry=${WAFER_REGISTRY:-ghcr.io/pedroklein}
ref="$registry/wafer-${pkg_name}:$version"
echo "Publishing $wasm_path to $ref"
wkg oci push "$ref" "$wasm_path"
echo "✓ Published $ref"
' --
'''

[tasks.publish-plugin-auth]
description = "Publish one plugin with inline credentials: mise run publish-plugin-auth <username> <token> <name> <version>"
quiet = true
run = '''
bash -c '
set -euo pipefail
if [ $# -ne 4 ]; then
  echo "usage: mise run publish-plugin-auth <username> <token> <name> <version>" >&2
  exit 2
fi
username=$1
token=$2
name=$3
version=$4
case "$name" in
  pass-through)    wasm_file="pass_through_transform.wasm" ;;
  uppercase)       wasm_file="uppercase_transform.wasm" ;;
  filter)          wasm_file="filter_transform.wasm" ;;
  json-parse)      wasm_file="json_parse_transform.wasm" ;;
  tensor-prep)     wasm_file="tensor_prep.wasm" ;;
  result-format)   wasm_file="result_format.wasm" ;;
  mnist-inference) wasm_file="mnist_inference.wasm" ;;
  *)               wasm_file="${name}_transform.wasm" ;;
esac
wasm_path="plugins/$name/target/wasm32-wasip2/release/$wasm_file"
if [ ! -f "$wasm_path" ]; then
  echo "Error: WASM not found at $wasm_path" >&2
  echo "Run 'mise run build-plugin $name' first" >&2
  exit 1
fi
pkg_name=$(echo "$name" | tr '-' '_')
registry=${WAFER_REGISTRY:-ghcr.io/pedroklein}
ref="$registry/wafer-${pkg_name}:$version"
echo "Publishing $wasm_path to $ref"
wkg oci push -u "$username" -p "$token" "$ref" "$wasm_path"
echo "✓ Published $ref"
' --
'''

[tasks.publish-all]
description = "Publish all built plugins: mise run publish-all <version>"
run = '''
bash -c '
set -euo pipefail
if [ $# -ne 1 ]; then
  echo "usage: mise run publish-all <version>" >&2
  exit 2
fi
version=$1
plugins=(pass-through uppercase filter json-parse tensor-prep result-format mnist-inference)
registry=${WAFER_REGISTRY:-ghcr.io/pedroklein}
for name in "${plugins[@]}"; do
  wasm_dir="plugins/$name/target/wasm32-wasip2/release"
  if [ -d "$wasm_dir" ] && ls "$wasm_dir"/*.wasm >/dev/null 2>&1; then
    echo "Publishing $name..."
    mise run publish-plugin "$name" "$version"
  else
    echo "Skipping $name (not built)"
  fi
done
echo ""
echo "✓ All plugins published to $registry"
' --
'''

[tasks.pull-plugin]
description = "Pull one plugin from OCI registry: mise run pull-plugin <name> <version>"
run = '''
bash -c '
set -euo pipefail
if [ $# -ne 2 ]; then
  echo "usage: mise run pull-plugin <name> <version>" >&2
  exit 2
fi
name=$1
version=$2
pkg_name=$(echo "$name" | tr '-' '_')
registry=${WAFER_REGISTRY:-ghcr.io/pedroklein}
ref="$registry/wafer-${pkg_name}:$version"
output="downloads/${pkg_name}-${version}.wasm"
mkdir -p downloads
echo "Pulling $ref to $output..."
wkg oci pull "$ref" -o "$output"
echo "✓ Downloaded to $output"
' --
'''

[tasks.pull-plugin-auth]
description = "Pull one plugin with inline credentials: mise run pull-plugin-auth <username> <token> <name> <version>"
quiet = true
run = '''
bash -c '
set -euo pipefail
if [ $# -ne 4 ]; then
  echo "usage: mise run pull-plugin-auth <username> <token> <name> <version>" >&2
  exit 2
fi
username=$1
token=$2
name=$3
version=$4
pkg_name=$(echo "$name" | tr '-' '_')
registry=${WAFER_REGISTRY:-ghcr.io/pedroklein}
ref="$registry/wafer-${pkg_name}:$version"
output="downloads/${pkg_name}-${version}.wasm"
mkdir -p downloads
echo "Pulling $ref to $output..."
wkg oci pull -u "$username" -p "$token" "$ref" -o "$output"
echo "✓ Downloaded to $output"
' --
'''

# =============================================================================
# Demo Commands
# =============================================================================

[tasks.run-local]
description = "Run sample pipeline with local plugins"
run = 'echo "Hello, World!" | cargo run -p wafer-runtime -- --config examples/dag-uppercase.toml'

[tasks.run-remote]
description = "Run sample pipeline with remote plugins"
run = 'echo "Hello, World!" | cargo run -p wafer-runtime -- --config examples/dag-remote.toml'

[tasks.run-remote-nocache]
description = "Run sample pipeline with remote plugins, bypassing cache"
run = 'echo "Hello, World!" | cargo run -p wafer-runtime -- --config examples/dag-remote.toml --no-cache'

# =============================================================================
# Cross-compile for aarch64-linux (Pi / Jetson / ARM64 servers)
# =============================================================================
#
# C1 (canonical-runs plan, 2026-08-02): cross-compile wafer, wafer-loadgen,
# and waferctl for aarch64-unknown-linux-gnu using a `linux/arm64` Docker
# container. On macOS aarch64 hosts (M-series) the `--platform linux/arm64`
# flag runs the container natively (no qemu emulation) so build times are
# comparable to a bare-metal Pi build.
#
# See docs/eval/cross-compile.md for the alternative paths tried
# (`cross` crate, homebrew `aarch64-linux-gnu-gcc`) and why the Docker
# path was chosen (reproducibility + no host toolchain drift).

[tasks.cross-build-pi]
description = "Cross-build wafer, wafer-loadgen, waferctl for aarch64-linux (Docker)"
run = '''
set -euo pipefail
if ! command -v docker >/dev/null 2>&1; then
  echo "error: docker is required for cross-build-pi" >&2
  exit 1
fi
mkdir -p target/docker-aarch64-linux
docker run --rm --platform linux/arm64 \
  -v "$PWD:/work" \
  -v "$PWD/target/docker-aarch64-linux:/work/target" \
  -w /work \
  rust:1-slim-bookworm \
  bash -c '
    apt-get update -q >/dev/null
    apt-get install -y -q pkg-config libssl-dev g++ >/dev/null
    cargo build --release -p wafer-runtime -p wafer-loadgen -p waferctl
  '
echo
echo "Cross-build outputs:"
for b in wafer wafer-loadgen waferctl; do
  f=target/docker-aarch64-linux/release/$b
  if [ -x "$f" ]; then
    file "$f" | sed "s|$PWD/||"
  else
    echo "MISSING: $f" >&2
    exit 1
  fi
done
'''

[tasks.cross-build-pi-check]
description = "Verify cross-build outputs are ARM aarch64 ELF binaries"
run = '''
set -euo pipefail
missing=0
for b in wafer wafer-loadgen waferctl; do
  f=target/docker-aarch64-linux/release/$b
  if [ ! -x "$f" ]; then
    echo "MISSING: $f" >&2
    missing=$((missing+1))
    continue
  fi
  if ! file "$f" | grep -q "ARM aarch64"; then
    echo "WRONG ARCH: $f is not ARM aarch64" >&2
    file "$f" >&2
    missing=$((missing+1))
    continue
  fi
  echo "OK   $f ($(du -h "$f" | cut -f1))"
done
[ "$missing" -eq 0 ] || { echo "cross-build-pi-check FAILED: $missing binary/binaries missing or wrong arch" >&2; exit 1; }
'''
