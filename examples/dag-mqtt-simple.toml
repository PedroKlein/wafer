# MQTT source -> MQTT sink

[engine]
default_queue_capacity = 1024

[nodes.mqtt-source]
type = "source"
kind = "mqtt"
broker = "localhost"
port = 1883
topic = "input/messages"
qos = 1
client_id = "wafer-source"

[nodes.mqtt-sink]
type = "sink"
kind = "mqtt"
broker = "localhost"
port = 1883
topic = "output/processed"
qos = 1
client_id = "wafer-sink"

[[edges]]
from = "mqtt-source"
to = "mqtt-sink"
