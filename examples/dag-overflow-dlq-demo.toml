# File source -> delayed transform -> file sink with policy-aware overflow.
# Build first: mise run //plugins:build-plugin delay-injector

[pipeline]
name = "overflow-dlq-demo"

[engine]
default_queue_capacity = 16

[dead_letter]
kind = "file"
path = "/tmp/wafer-dlq.jsonl"
queue_capacity = 64

[api]
enabled = true
bind = "127.0.0.1:9090"

[metrics]
enabled = true
path = "/metrics"

[nodes.source]
type = "source"
kind = "file"
path = "/tmp/wafer-input.txt"

[nodes.slow]
type = "transform"
plugin = "../plugins/delay-injector/target/wasm32-wasip2/release/wafer_delay_injector.wasm"

[nodes.slow.config]
delay_ms = 50

[nodes.sink]
type = "sink"
kind = "file"
path = "/tmp/wafer-output.txt"
append = true

[[edges]]
from = "source"
to = "slow"
capacity = 1
overflow = "dead-letter"

[[edges]]
from = "slow"
to = "sink"
capacity = 16
overflow = "slow"
