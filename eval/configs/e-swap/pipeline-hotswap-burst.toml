# E-Swap-4: one source-driven 1,000→2,000→1,000 msg/s burst and one centered swap.

[pipeline]
name = "e-swap-4-burst"
description = "Hotswap under 2x burst load (E-Swap-4)"

[engine]
epoch_deadline = 100
epoch_tick_ms = 10

[engine.fuel]
transform = 10000000
filter = 500000
router = 500000

[nodes.source]
type = "source"
kind = "bench-source"
rate = 1000.0
total_messages = 160000
warmup_messages = 30000
payload_size = 128

[nodes.source.burst]
rate = 2000.0
start_secs = 55
end_secs = 65

[nodes.transform]
type = "transform"
plugin = "../../../plugins/pass-through-v1/target/wasm32-wasip2/release/wafer_pass_through_v1.wasm"

[nodes.sink]
type = "sink"
kind = "bench-sink"
warmup_secs = 30
track_sequences = true
track_hotswap = true

[api]
enabled = true
bind = "127.0.0.1:9090"

[metrics]
enabled = true

[[edges]]
from = "source"
to = "transform"

[[edges]]
from = "transform"
to = "sink"
