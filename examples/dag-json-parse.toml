# stdin -> JSON normalizer -> stdout
# Build first: mise run //plugins:build-plugin json-parse
# Run: echo '{"name":"wafer","version":1}' | cargo run -p wafer-runtime -- --config examples/dag-json-parse.toml

[engine]
default_queue_capacity = 1024

[dead_letter]
kind = "file"
path = "dlq.jsonl"

[nodes.source]
type = "source"
kind = "stdin"

[nodes.json-parse]
type = "transform"
plugin = "../plugins/json-parse/target/wasm32-wasip2/release/wafer_json_parse.wasm"

[nodes.sink]
type = "sink"
kind = "stdout"

[[edges]]
from = "source"
to = "json-parse"

[[edges]]
from = "json-parse"
to = "sink"
