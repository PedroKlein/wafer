# Diagnostic fixed-rate sweep for matched Pipeline A comparators.
# Rate points and thresholds are frozen before Raspberry Pi 5 execution.

[loadgen]
rate = 1000
duration_secs = 60
warmup_secs = 30
topic = "wafer/telemetry"
payload_template = "telemetry-120b"
payload_template_sha256 = "fffb14064f8d7956b5ce410c8298ab5c511bd46e5dffcde8389975337a0e38d1"
profile = "steady"

[sweep]
rate_points_msg_s = [500, 1000, 2000, 4000, 8000, 16000]
baseline_rate_msg_s = 1000
p99_multiplier_limit = 2.0
max_loss_percent = 1.0
repetitions = 4
ordering = "seeded rate blocks with four-run rotated system order"
p99_aggregation = "median across repetitions"
loss_aggregation = "sum(lost) / sum(offered)"
thesis_evidence = false
