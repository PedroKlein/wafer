# Pipeline A telemetry: MQTT source → JSON parse → threshold filter → MQTT sink.
#
# Drives the E2E evaluation (E-Perf-1, E-Perf-2). Same schema and topology
# is used for eKuiper and the native baseline so comparisons are apples-to-
# apples per RFC-008 D6.

[pipeline]
name = "bench-telemetry"
description = "Pipeline A: MQTT → json-parse → threshold-filter → MQTT (E-Perf-1, E-Perf-2)"

[nodes.mqtt-in]
type = "source"
kind = "mqtt"
broker = "localhost"
port = 1883
topic = "wafer/bench/input"
qos = 1
client_id = "wafer-runtime-in"

[nodes.parser]
type = "transform"
plugin = "../../plugins/json-parse/target/wasm32-wasip2/release/wafer_json_parse.wasm"

[nodes.filter]
type = "filter"
plugin = "../../plugins/threshold-filter/target/wasm32-wasip2/release/wafer_threshold_filter.wasm"

[nodes.filter.config]
threshold = 50.0

[nodes.mqtt-out]
type = "sink"
kind = "mqtt"
broker = "localhost"
port = 1883
topic = "wafer/bench/output"
qos = 1
client_id = "wafer-runtime-out"

[[edges]]
from = "mqtt-in"
to = "parser"

[[edges]]
from = "parser"
to = "filter"

[[edges]]
from = "filter"
to = "mqtt-out"
