# E-Iso-2: cross-read containment shakedown.
#
# Linear pipeline: bench-source → attack (cross-read) → bench-sink.
# Attack dereferences a fabricated host address. Proves linear-memory isolation.

[pipeline]
name = "e-iso-2-cross-read"
description = "Cross-read attack in position 2 of 3-node linear pipeline"

[engine]
epoch_deadline = 100
epoch_tick_ms = 10

[engine.fuel]
transform = 10000000
filter = 500000
router = 500000

[nodes.source]
type = "source"
kind = "bench-source"
rate = 100.0
total_messages = 12000
warmup_messages = 0
payload_size = 128

[nodes.attack]
type = "transform"
plugin = "../../../plugins/attacks/cross-read/target/wasm32-wasip2/release/wafer_attack_cross_read.wasm"

[nodes.sink]
type = "sink"
kind = "bench-sink"
warmup_secs = 0
track_sequences = false
track_hotswap = false

[[edges]]
from = "source"
to = "attack"

[[edges]]
from = "attack"
to = "sink"
