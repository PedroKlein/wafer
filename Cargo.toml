[package]
name = "wafer-poc"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["."]
exclude = ["plugins/pass-through"]

[workspace.dependencies]
petgraph = "0.6"
# NOTE: Using git revision for wasmtime because wasmtime-wasi-nn 41.0.3 on crates.io
# has a bug with the ort (ONNX Runtime) crate API - "no method named 'context' found".
# This revision contains the fix. Can switch back to crates.io when wasmtime 42.x releases.
wasmtime = { git = "https://github.com/bytecodealliance/wasmtime", rev = "456310751e355b9fb0aea533c6d04be3b07d32b7" }
wasmtime-wasi = { git = "https://github.com/bytecodealliance/wasmtime", rev = "456310751e355b9fb0aea533c6d04be3b07d32b7" }
wasmtime-wasi-nn = { git = "https://github.com/bytecodealliance/wasmtime", rev = "456310751e355b9fb0aea533c6d04be3b07d32b7", features = ["onnx"] }
tokio = { version = "1", features = ["rt", "macros", "io-std", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
anyhow = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

[dependencies]
petgraph.workspace = true
wasmtime.workspace = true
wasmtime-wasi.workspace = true
wasmtime-wasi-nn.workspace = true
ort = { version = "2.0.0-rc.10", features = ["download-binaries"] }
tokio.workspace = true
serde.workspace = true
thiserror.workspace = true
anyhow.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
serde_json = "1"

[patch.crates-io]
ort = { git = "https://github.com/pykeio/ort", tag = "v2.0.0-rc.10" }
