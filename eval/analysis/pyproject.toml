[project]
name = "wafer-analysis"
version = "0.1.0"
description = "WAFER thesis evaluation analysis and figure generation"
requires-python = ">=3.11"
dependencies = [
    "scipy>=1.14",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pandas>=2.2",
    "hdrhistogram>=0.10",
    "statsmodels>=0.14",
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wafer_analysis"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
