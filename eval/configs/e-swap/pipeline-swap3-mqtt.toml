# E-Swap-3: Pipeline A with the API enabled for the hot-swap REST call.
# The wafer-hotswap arm swaps the threshold filter for threshold-filter-v2,
# which raises the lower bound to 60 as the eKuiper replacement rule does.
# The workload's temperature is 72.5, so both versions pass every message.

[pipeline]
name = "e-swap-3-hotswap"
description = "E-Swap-3: Pipeline A with a swappable threshold filter"

[engine]
epoch_deadline = 100
epoch_tick_ms = 10

[engine.fuel]
transform = 10000000
filter = 500000
router = 500000

[dead_letter]
kind = "file"
path = "dlq.jsonl"

[nodes.mqtt-in]
type = "source"
kind = "mqtt"
broker = "localhost"
port = 1883
topic = "wafer/telemetry"
qos = 1
client_id = "wafer-swap3-in"

[nodes.filter]
type = "filter"
plugin = "../../../plugins/threshold-filter/target/wasm32-wasip2/release/wafer_threshold_filter.wasm"

[nodes.filter.config]
field = "temperature"
min = 50.0
max = 99999.0

[nodes.mqtt-out]
type = "sink"
kind = "mqtt"
broker = "localhost"
port = 1883
topic = "wafer/telemetry/hot"
qos = 1
client_id = "wafer-swap3-out"

[api]
enabled = true
bind = "127.0.0.1:9090"

[[edges]]
from = "mqtt-in"
to = "filter"

[[edges]]
from = "filter"
to = "mqtt-out"
