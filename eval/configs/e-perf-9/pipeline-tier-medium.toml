# E-Perf-9 filesystem-cache cold/warm — medium tier (tensor-prep, ~97 KB .wasm).

[pipeline]
name = "e-perf-9-tier-medium"
description = "Filesystem-cache startup measurement — medium plugin (tensor-prep, 97 KB)"

[engine]
epoch_deadline = 100
epoch_tick_ms = 10

[engine.fuel]
transform = 10000000
filter = 500000
router = 500000

[nodes.source]
type = "source"
kind = "bench-source"
rate = 100.0
total_messages = 1
warmup_messages = 0
payload_size = 128

[nodes.t1]
type = "transform"
plugin = "../../../plugins/tensor-prep/target/wasm32-wasip2/release/wafer_tensor_prep.wasm"
config = { fields = ["temperature"], normalize = false }

[nodes.sink]
type = "sink"
kind = "bench-sink"
warmup_secs = 0
track_sequences = true

[[edges]]
from = "source"
to = "t1"

[[edges]]
from = "t1"
to = "sink"
