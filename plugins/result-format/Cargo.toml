[package]
name = "wafer-result-format"
version = "0.1.0"
edition = "2024"
description = "Result format plugin for WAFER inference output parsing"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.53"
wafer-plugin = { path = "../../crates/wafer-plugin" }

[profile.release]
opt-level = "s"
lto = true
strip = "debuginfo"
