# WAFER load profile: stepwise ramp. Drives E-Perf-9 saturation detection.
#
# Starts at 100 msg/s; every 10s the rate steps up by 100 msg/s until it
# reaches the ceiling. The `wafer_loadgen::LoadShape::Ramp` scheduler does
# NOT rebuild `tokio::time::interval` per tick — the shape is a pure
# function of elapsed time and the scheduler maintains one running offset.

[loadgen]
rate = 100                     # base rate (matches ramp_start_rate)
duration_secs = 300
warmup_secs = 30
topic = "wafer/bench/input"
payload_template = "telemetry-120b"
profile = "ramp"
ramp_start_rate = 100
ramp_step_rate = 100
ramp_step_interval_secs = 10
ramp_max_rate = 10000
