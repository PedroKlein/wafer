[package]
name = "wafer-loadgen"
description = "WAFER evaluation: MQTT load generator + latency-recording subscriber"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "wafer_loadgen"
path = "src/lib.rs"

[[bin]]
name = "wafer-loadgen"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
rumqttc = "0.25"
reqwest = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
base64 = "0.22.1"
hdrhistogram = "7"
blake3 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
sha2 = { workspace = true }
axum = { workspace = true }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["mosquitto"] }

[lints]
workspace = true
