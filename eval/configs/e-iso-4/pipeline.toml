# E-Iso-4: infinite-loop containment shakedown.
#
# Linear pipeline: bench-source → attack (infinite-loop) → bench-sink.
# Attack enters `loop {}`. Epoch interrupt fires after the deadline.

[pipeline]
name = "e-iso-4-infinite-loop"
description = "Infinite-loop attack in position 2 of 3-node linear pipeline"

[engine]
epoch_deadline = 1
epoch_tick_ms = 10

[nodes.source]
type = "source"
kind = "bench-source"
rate = 100.0
total_messages = 12000
warmup_messages = 0
payload_size = 128

[nodes.attack]
type = "transform"
plugin = "../../../plugins/attacks/infinite-loop/target/wasm32-wasip2/release/wafer_attack_infinite_loop.wasm"

[nodes.sink]
type = "sink"
kind = "bench-sink"
warmup_secs = 0
track_sequences = false
track_hotswap = false

[[edges]]
from = "source"
to = "attack"

[[edges]]
from = "attack"
to = "sink"
