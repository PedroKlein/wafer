# stdin -> uppercase -> stdout
# Build first: mise run //plugins:build-plugin uppercase
# Run: echo "hello world" | cargo run -p wafer-runtime -- --config examples/dag-uppercase.toml

[engine]
default_queue_capacity = 1024

[dead_letter]
kind = "file"
path = "dlq.jsonl"

[nodes.source]
type = "source"
kind = "stdin"

[nodes.uppercase]
type = "transform"
plugin = "../plugins/uppercase/target/wasm32-wasip2/release/wafer_uppercase.wasm"

[nodes.sink]
type = "sink"
kind = "stdout"

[[edges]]
from = "source"
to = "uppercase"

[[edges]]
from = "uppercase"
to = "sink"
