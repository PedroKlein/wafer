# Passthrough with no metering trap possible (both fuel and epoch use
# large sentinels so neither budget trips inside a single hop).
#
# Ablation for E-Perf-7 metering-overhead decomposition. This is the
# closest we can get to "just Wasm execution cost" from the config layer.
# Note that `set_fuel` and `set_epoch_deadline` still run per call — the
# ablation isolates trap-check cost, not the API-call cost, which is
# unavoidable on the current runtime.

[pipeline]
name = "bench-passthrough-no-metering"
description = "Passthrough with no metering trap — reference for E-Perf-7"

[engine]
epoch_deadline = 1000000000

[engine.fuel]
transform = 999999999999
filter = 999999999999
router = 999999999999

[nodes.source]
type = "source"
kind = "bench-source"
rate = 1000.0
total_messages = 60000
warmup_messages = 30000
payload_size = 128

[nodes.transform]
type = "transform"
plugin = "../../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.sink]
type = "sink"
kind = "bench-sink"
warmup_secs = 30
track_sequences = true

[[edges]]
from = "source"
to = "transform"

[[edges]]
from = "transform"
to = "sink"
