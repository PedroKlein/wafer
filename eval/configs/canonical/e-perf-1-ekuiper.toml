[comparator]
system = "ekuiper"
version = "2.1.0"
deployment = "native-arm64"
broker = "tcp://127.0.0.1:1883"
input_topic = "wafer/telemetry"
output_topic = "wafer/telemetry/hot"
stream = "CREATE STREAM wafer_telemetry (seq BIGINT, ts BIGINT, temperature FLOAT) WITH (TYPE=\"mqtt\", DATASOURCE=\"wafer/telemetry\", FORMAT=\"json\", SHARED=\"true\")"
rule = "SELECT ts, seq, temperature FROM wafer_telemetry WHERE temperature > 50"
