# Native baseline (no Wasm — direct Rust function calls).
#
# P0.4 wires "plugin.kind = native" into the schema so `wafer` can
# execute the RFC-008 §D5 Layer-1 baseline through the same DAG,
# channels, and BenchSink measurement path as any Wasm pipeline.
# The confounder we're isolating in RQ1 is therefore the
# fuel/epoch/StoreLimits/WIT-crossing machinery, not envelope shape
# or task scheduling.

[pipeline]
name = "bench-native-baseline"
description = "Native Rust baseline for RQ1 (P0.4 AC2)."

[nodes.source]
type = "source"
kind = "bench-source"
rate = 1000.0
total_messages = 90000
warmup_messages = 30000
payload_size = 128

[nodes.transform]
type = "transform"
# Native baseline transform — passthrough by default.
# Swap `function = "json-parse"` to exercise the JSON-parsing baseline.
plugin = { kind = "native", function = "passthrough" }

[nodes.sink]
type = "sink"
kind = "bench-sink"
warmup_secs = 30
track_sequences = true

[[edges]]
from = "source"
to = "transform"

[[edges]]
from = "transform"
to = "sink"
