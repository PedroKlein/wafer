# Pipeline A (WAFER): MQTT source → Wasm threshold-filter → MQTT sink.
#
# Mirrors eKuiper's Pipeline A semantics: pass 50 <= temperature <= 99999.
# Driven by wafer-loadgen (payload template telemetry-120b, temperature=72.5).
# Used in E-Perf-1 (throughput), E-Perf-2 (latency), E-Swap-3 comparisons.
# See RFC-008 §D6.

[pipeline]
name = "pipeline-a-wafer"
description = "Pipeline A: MQTT → threshold-filter (Wasm) → MQTT"

[engine]
epoch_deadline = 100
epoch_tick_ms = 10

[engine.fuel]
transform = 10000000
filter = 500000
router = 500000

[nodes.mqtt-in]
type = "source"
kind = "mqtt"
broker = "localhost"
port = 1883
topic = "wafer/telemetry"
qos = 1
client_id = "wafer-pipeline-a-in"

[nodes.filter]
type = "filter"
plugin = "../../plugins/threshold-filter/target/wasm32-wasip2/release/wafer_threshold_filter.wasm"

[nodes.filter.config]
field = "temperature"
min = 50.0
max = 99999.0

[nodes.mqtt-out]
type = "sink"
kind = "mqtt"
broker = "localhost"
port = 1883
topic = "wafer/telemetry/hot"
qos = 1
client_id = "wafer-pipeline-a-out"

[[edges]]
from = "mqtt-in"
to = "filter"

[[edges]]
from = "filter"
to = "mqtt-out"
