[pipeline]
name = "e-iso-7-independent-branches"
description = "Matched independent branch populations"

[engine]
epoch_deadline = 2
epoch_tick_ms = 1

[nodes.source_a]
type = "source"
kind = "bench-source"
rate = 1000.0
total_messages = 90000
warmup_messages = 30000
payload_size = 128

[nodes.source_b]
type = "source"
kind = "bench-source"
rate = 1000.0
total_messages = 90000
warmup_messages = 30000
payload_size = 128

[nodes.branch_a]
type = "transform"
plugin = "../../../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.branch_b]
type = "transform"
plugin = "../../../plugins/attacks/panic/target/wasm32-wasip2/release/wafer_attack_panic.wasm"

[nodes.branch_a_sink]
type = "sink"
kind = "bench-sink"
warmup_secs = 30
track_sequences = true
track_hotswap = false
output_dir = "branch-a"

[nodes.branch_b_sink]
type = "sink"
kind = "bench-sink"
warmup_secs = 30
track_sequences = true
track_hotswap = false
output_dir = "branch-b"

[[edges]]
from = "source_a"
to = "branch_a"

[[edges]]
from = "source_b"
to = "branch_b"

[[edges]]
from = "branch_a"
to = "branch_a_sink"

[[edges]]
from = "branch_b"
to = "branch_b_sink"
