[workspace]
resolver = "2"
members = [
  "crates/wafer-config",
  "crates/wafer-core",
  "crates/wafer-loadgen",
  "crates/wafer-plugin",
  "crates/wafer-runtime",
  "crates/wafer-types",
  "crates/waferctl",
]
exclude = ["plugins/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Pedro Klein <pedroklein1@hotmail.com>"]
repository = "https://github.com/PedroKlein/wafer"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
# Internal crates
wafer-config = { path = "crates/wafer-config" }
wafer-core = { path = "crates/wafer-core" }
wafer-types = { path = "crates/wafer-types" }

# Graph
petgraph = "0.8"

# NOTE: Using git main branch for wasmtime because:
# 1. wasmtime-wasi-nn 41.0.3 on crates.io has a bug with ort (ONNX Runtime) crate API
# 2. PR #12379 (merged Jan 23, 2026) fixes "assertion failed: self.threads.is_empty()"
#    panic in concurrent.rs that occurred with async component model in long-lived pipelines
# Can switch back to crates.io when wasmtime 42.x releases.
wasmtime = { git = "https://github.com/bytecodealliance/wasmtime", branch = "main" }
wasmtime-wasi = { git = "https://github.com/bytecodealliance/wasmtime", branch = "main" }
wasmtime-wasi-nn = { git = "https://github.com/bytecodealliance/wasmtime", branch = "main", features = [
  "onnx",
] }

# Async runtime
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "io-std",
  "sync",
  "time",
  "signal",
  "fs",
] }
tokio-util = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4", features = ["derive"] }

# HTTP (feature-gated in wafer-core)
axum = "0.8"
tower-http = { version = "0.6", features = ["trace", "cors"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }

# Metrics
prometheus-client = "0.23"

# System metrics
sysinfo = "0.34"
memory-stats = "1"

# CLI output
tabled = "0.18"

# Misc
uuid = { version = "1", features = ["v4"] }
bytes = "1"
tempfile = "3"
oci-client = "0.16"
semver = "1"
sha2 = "0.10"
hex = "0.4"
dirs = "6"
futures-util = "0.3"
blake3 = "1"
foldhash = "0.1"

[workspace.lints.rust]
future-incompatible = { level = "deny", priority = -1 }
nonstandard-style = { level = "deny", priority = -1 }
rust-2018-idioms = { level = "deny", priority = -1 }
rust-2024-compatibility = { level = "deny", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# === Groups ===
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

# === Don't Panic (WAFER runs 24/7 — panics kill all healthy nodes) ===
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
unchecked_time_subtraction = "deny"
exit = "deny"
as_conversions = "deny"

# === Don't Fail Silently ===
let_underscore_future = "deny"
let_underscore_must_use = "warn"
unused_result_ok = "deny"
map_err_ignore = "deny"
assertions_on_result_states = "warn"
# === Don't Do Bad Async Stuff (see async-tokio skill) ===
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
large_futures = "warn"

# === Memory & Unsafe ===
mem_forget = "warn"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "warn"

# === Performance (see rust-best-practices: zero-allocation hot path) ===
format_push_string = "deny"
redundant_clone = "deny"
clone_on_copy = "deny"
needless_collect = "warn"
large_enum_variant = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
needless_pass_by_value = "warn"
rc_mutex = "deny"

# === Modern Idioms (Edition 2024) ===
manual_let_else = "warn"
or_fun_call = "warn"
needless_borrow = "deny"

# === Numeric Safety ===
cast_sign_loss = "deny"
float_cmp = "warn"
lossy_float_literal = "warn"

# === Don't #[allow] Without Reason (forces #[expect(..., reason = "...")] ) ===
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# === Debug Artifacts (must not reach production) ===
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

# === Documentation ===
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[patch.crates-io]
# NOTE: ort version must match what wasmtime-wasi-nn expects. Cannot upgrade independently.
ort = { git = "https://github.com/pykeio/ort", tag = "v2.0.0-rc.10" }
