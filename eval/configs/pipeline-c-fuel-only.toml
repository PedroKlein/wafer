# Passthrough with fuel metering only; epoch is disabled by omission.
#
# Ablation for E-Perf-7 metering-overhead decomposition. Epoch is set to a

[pipeline]
name = "bench-passthrough-fuel-only"
description = "Passthrough with fuel metering only (epoch effectively disabled)"

[engine]
epoch_tick_ms = 10

[engine.fuel]
transform = 10000000

[nodes.source]
type = "source"
kind = "bench-source"
rate = 1000.0
total_messages = 90000
warmup_messages = 30000
payload_size = 128

[nodes.transform]
type = "transform"
plugin = "../../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.sink]
type = "sink"
kind = "bench-sink"
warmup_secs = 30
track_sequences = true

[[edges]]
from = "source"
to = "transform"

[[edges]]
from = "transform"
to = "sink"
