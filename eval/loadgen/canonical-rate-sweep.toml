# Final trace-free E-Perf-10 load profile. Rates and repetitions come from
# eval/canonical-matrix.json, the sole executable source of truth.

[loadgen]
rate = 1000
duration_secs = 60
warmup_secs = 30
topic = "wafer/telemetry"
payload_template = "telemetry-120b"
payload_template_sha256 = "fffb14064f8d7956b5ce410c8298ab5c511bd46e5dffcde8389975337a0e38d1"
profile = "steady"

[sweep]
rate_points_msg_s = [1000, 4000, 8000, 15000, 16000]
baseline_rate_msg_s = 1000
normalized_p99_knee_multiplier = 2.0
max_loss_percent = 1.0
min_achieved_ratio = 0.99
repetitions = 30
ordering = "seeded rate blocks with thirty-run balanced system order"
p99_aggregation = "median of run p99 normalized to system baseline median"
loss_aggregation = "sum(total_undelivered) / sum(intended)"
achieved_aggregation = "mean(run achieved_rate / intended_rate)"
thesis_evidence = true
