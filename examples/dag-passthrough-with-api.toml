# stdin -> pass-through -> stdout with the control plane enabled
# Build first: mise run //plugins:build-plugin pass-through
# Run: cargo run -p wafer-runtime -- --config examples/dag-passthrough-with-api.toml

[pipeline]
name = "passthrough-demo"
description = "Demo pipeline with control plane enabled"

[api]
enabled = true
bind = "127.0.0.1:9090"

[metrics]
enabled = true
path = "/metrics"

[dead_letter]
kind = "file"
path = "dlq.jsonl"

[nodes.source]
type = "source"
kind = "stdin"

[nodes.passthrough]
type = "transform"
plugin = "../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.sink]
type = "sink"
kind = "stdout"

[[edges]]
from = "source"
to = "passthrough"

[[edges]]
from = "passthrough"
to = "sink"
