[pipeline]
name = "shakedown"
description = "Short shakedown run for run-experiment.sh AC2"

[nodes.source]
type = "source"
kind = "bench-source"
rate = 1000.0
total_messages = 3000
warmup_messages = 500
payload_size = 128

[nodes.transform]
type = "transform"
plugin = "../../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.sink]
type = "sink"
kind = "bench-sink"
warmup_secs = 1
track_sequences = true

[[edges]]
from = "source"
to = "transform"

[[edges]]
from = "transform"
to = "sink"
