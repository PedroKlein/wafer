# E-Val-1: methodology validation.
#
# Injects a known 50 ms delay via delay-injector; a p99 measurement outside
# the [45,55] ms window means the measurement rig is lying about tail
# latency (or coordinated omission is being ignored somewhere).
#
# See docs/rfcs/RFC-008-evaluation-harness.md §D9 and
# plans/evaluation-infrastructure/execution-playbook.md.

[pipeline]
name = "e-val-1-methodology"
description = "50 ms injected delay + honest p99 gate"

[nodes.source]
type = "source"
kind = "bench-source"
# Rate must sit well below sink capacity (1000/50 ms = 20 msg/s) or the queue
# back-pressures and observed p99 reports queue-wait + processing, not just
# processing. 10 msg/s gives 50% headroom on the 20 msg/s ceiling.
rate = 10.0
total_messages = 300
warmup_messages = 50
payload_size = 128

[nodes.delay]
type = "transform"
plugin = "../../plugins/delay-injector/target/wasm32-wasip2/release/wafer_delay_injector.wasm"

[nodes.delay.config]
delay_ms = 50

[nodes.sink]
type = "sink"
kind = "bench-sink"
warmup_secs = 5
track_sequences = true
track_hotswap = false

[[edges]]
from = "source"
to = "delay"

[[edges]]
from = "delay"
to = "sink"
