# stdin -> content router -> two file sinks
# Build first: mise run //plugins:build-plugin content-router
# Run: echo '{"route":"a","data":"hello"}' | cargo run -p wafer-runtime -- --config examples/dag-fanout.toml

[engine]
default_queue_capacity = 1024

[dead_letter]
kind = "file"
path = "dlq.jsonl"

[nodes.source]
type = "source"
kind = "stdin"

[nodes.router]
type = "router"
plugin = "../plugins/content-router/target/wasm32-wasip2/release/wafer_content_router.wasm"

[nodes.router.config]
route_field = "route"
default_port = "port-b"
routes = { a = "port-a", b = "port-b" }

[nodes.sink-a]
type = "sink"
kind = "file"
path = "/tmp/fanout-a.txt"

[nodes.sink-b]
type = "sink"
kind = "file"
path = "/tmp/fanout-b.txt"

[[edges]]
from = "source"
to = "router"

[[edges]]
from = "router"
to = "sink-a"
port = "port-a"

[[edges]]
from = "router"
to = "sink-b"
port = "port-b"
