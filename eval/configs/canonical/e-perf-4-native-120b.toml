[pipeline]
name = "e-perf-4-native-120b"
description = "Native pass-through baseline for the boundary benchmark with 120-byte payload"

[dead_letter]
kind = "file"
path = "dlq.jsonl"

[nodes.source]
type = "source"
kind = "bench-source"
rate = 1000.0
total_messages = 90000
warmup_messages = 30000
payload_size = 120

[nodes.transform]
type = "transform"
plugin = { kind = "native", function = "passthrough" }

[nodes.sink]
type = "sink"
kind = "bench-sink"
warmup_secs = 30
track_sequences = true
track_hotswap = false

[[edges]]
from = "source"
to = "transform"

[[edges]]
from = "transform"
to = "sink"
