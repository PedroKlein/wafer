# Passthrough with epoch metering only (fuel effectively disabled).
#
# Ablation for E-Perf-7 metering-overhead decomposition. Fuel is set to a
# 1e12 sentinel per node category — far above any real single-call cost —
# so `set_fuel` still runs (its cost lands in the ablation) but the budget
# never trips. The runtime does NOT treat `fuel = 0` as unlimited; that
# would trap the first hop.

[pipeline]
name = "bench-passthrough-epoch-only"
description = "Passthrough with epoch metering only (fuel effectively disabled)"

[engine.fuel]
transform = 999999999999
filter = 999999999999
router = 999999999999

[nodes.source]
type = "source"
kind = "bench-source"
rate = 1000.0
total_messages = 90000
warmup_messages = 30000
payload_size = 128

[nodes.transform]
type = "transform"
plugin = "../../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.sink]
type = "sink"
kind = "bench-sink"
warmup_secs = 30
track_sequences = true

[[edges]]
from = "source"
to = "transform"

[[edges]]
from = "transform"
to = "sink"
