# stdin -> pass-through -> stdout
# Build first: mise run //plugins:build-plugin pass-through
# Run: echo "Hello World" | cargo run -p wafer-runtime -- --config examples/dag-passthrough.toml

[engine]
default_queue_capacity = 1024

[dead_letter]
kind = "file"
path = "dlq.jsonl"

[nodes.source]
type = "source"
kind = "stdin"

[nodes.passthrough]
type = "transform"
plugin = "../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.sink]
type = "sink"
kind = "stdout"

[[edges]]
from = "source"
to = "passthrough"

[[edges]]
from = "passthrough"
to = "sink"
