# E-Perf-9 filesystem-cache cold/warm — small tier (pass-through, ~57 KB .wasm).
#
# Minimal pipeline for startup latency measurement: bench-source emits one
# message so process completion closely follows the first sink observation.

[pipeline]
name = "e-perf-9-tier-small"
description = "Filesystem-cache startup measurement — small plugin (pass-through, 57 KB)"

[engine]
epoch_deadline = 100
epoch_tick_ms = 10

[engine.fuel]
transform = 10000000
filter = 500000
router = 500000

[nodes.source]
type = "source"
kind = "bench-source"
rate = 100.0
total_messages = 1
warmup_messages = 0
payload_size = 128

[nodes.t1]
type = "transform"
plugin = "../../../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.sink]
type = "sink"
kind = "bench-sink"
warmup_secs = 0
track_sequences = true

[[edges]]
from = "source"
to = "t1"

[[edges]]
from = "t1"
to = "sink"
