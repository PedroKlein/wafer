[workspace]
resolver = "2"
members = [
    "crates/wafer-core",
    "crates/wafer-runtime",
    "crates/wafer-types",
    "crates/waferctl",
]
exclude = ["plugins/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Pedro Klein <pedroklein1@hotmail.com>"]
repository = "https://github.com/PedroKlein/wafer-poc"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
# Internal crates
wafer-core = { path = "crates/wafer-core" }
wafer-types = { path = "crates/wafer-types" }

# Graph
petgraph = "0.8"

# NOTE: Using git main branch for wasmtime because:
# 1. wasmtime-wasi-nn 41.0.3 on crates.io has a bug with ort (ONNX Runtime) crate API
# 2. PR #12379 (merged Jan 23, 2026) fixes "assertion failed: self.threads.is_empty()"
#    panic in concurrent.rs that occurred with async component model in long-lived pipelines
# Can switch back to crates.io when wasmtime 42.x releases.
wasmtime = { git = "https://github.com/bytecodealliance/wasmtime", branch = "main" }
wasmtime-wasi = { git = "https://github.com/bytecodealliance/wasmtime", branch = "main" }
wasmtime-wasi-nn = { git = "https://github.com/bytecodealliance/wasmtime", branch = "main", features = ["onnx"] }

# Async runtime
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-std", "sync", "time", "signal", "fs"] }
tokio-util = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# HTTP (feature-gated in wafer-core)
axum = "0.8"
tower-http = { version = "0.6", features = ["trace", "cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Metrics
prometheus-client = "0.23"

# CLI output
tabled = "0.18"

# Misc
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
oci-client = "0.16"
semver = "1"
sha2 = "0.10"
hex = "0.4"
dirs = "6"
futures-util = "0.3"

[patch.crates-io]
# NOTE: ort version must match what wasmtime-wasi-nn expects. Cannot upgrade independently.
ort = { git = "https://github.com/pykeio/ort", tag = "v2.0.0-rc.10" }
