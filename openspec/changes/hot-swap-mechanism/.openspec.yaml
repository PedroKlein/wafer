summary: |
  Implemented drain-and-flip hot-swap mechanism for zero-downtime WASM component updates.
  
  Key deliverables:
  - NodeStateTracker with state machine (Starting → Running → Draining → Retired)
  - HotSwapCoordinator with prepare/drain/flip/retire phases
  - RoutingController with message buffering during drain
  - ConfigDiff for detecting WASM path changes
  - resync() method for config-driven hot-swaps
  - Hot-swap metrics (timing per phase, message counts, success/failure)
  - Benchmarks showing <100ms swap latency target achieved
  
  Implementation locations:
  - crates/wafer-core/src/node/state.rs - NodeStateTracker
  - crates/wafer-core/src/dag/hotswap.rs - HotSwapCoordinator
  - crates/wafer-core/src/dag/routing.rs - RoutingController
  - crates/wafer-core/src/config/diff.rs - ConfigDiff
  - crates/wafer-core/benches/hot_swap.rs - Benchmarks
