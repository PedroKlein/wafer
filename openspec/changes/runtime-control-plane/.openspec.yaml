summary: |
  Implemented REST API control plane for runtime management and hot-swap triggers.
  
  Key deliverables:
  - Axum-based HTTP server with health, metrics, and control endpoints
  - GET /healthz, /readyz - Health and readiness probes
  - GET /metrics - Prometheus-format metrics endpoint
  - POST /api/v1/resync - Trigger config resync and hot-swap
  - POST /api/v1/nodes/{id}/swap - Direct node hot-swap trigger
  - GET /api/v1/nodes - List nodes with state information
  - OpenAPI documentation
  - Integration with DagOrchestrator for hot-swap coordination
  
  Implementation locations:
  - crates/wafer-core/src/control/ - Control plane module
  - crates/wafer-core/src/control/server.rs - HTTP server setup
  - crates/wafer-core/src/control/handlers.rs - Request handlers
  - crates/wafer-core/src/control/routes.rs - Route definitions
