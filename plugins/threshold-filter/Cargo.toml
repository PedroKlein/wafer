[package]
name = "wafer-threshold-filter"
version = "0.1.0"
edition = "2024"
description = "Threshold filter plugin for WAFER pipeline - filter-node world"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.53"
wafer-plugin = { path = "../../crates/wafer-plugin" }

[profile.release]
opt-level = "s"
lto = true
strip = "debuginfo"
