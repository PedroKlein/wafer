# E-Perf-6/8 depth scaling — 10 hops (shakedown density).
#
# Linear pipeline: bench-source → 10× pass-through → bench-sink.
# Reduced message count for shakedown speed (5s per run).

[pipeline]
name = "e-perf-6-depth-10"
description = "10 pass-through hops — shakedown density"

[nodes.source]
type = "source"
kind = "bench-source"
rate = 1000.0
total_messages = 5000
warmup_messages = 1000
payload_size = 128

[nodes.t1]
type = "transform"
plugin = "../../../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.t2]
type = "transform"
plugin = "../../../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.t3]
type = "transform"
plugin = "../../../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.t4]
type = "transform"
plugin = "../../../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.t5]
type = "transform"
plugin = "../../../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.t6]
type = "transform"
plugin = "../../../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.t7]
type = "transform"
plugin = "../../../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.t8]
type = "transform"
plugin = "../../../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.t9]
type = "transform"
plugin = "../../../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.t10]
type = "transform"
plugin = "../../../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.sink]
type = "sink"
kind = "bench-sink"
warmup_secs = 1
track_sequences = true

[[edges]]
from = "source"
to = "t1"

[[edges]]
from = "t1"
to = "t2"

[[edges]]
from = "t2"
to = "t3"

[[edges]]
from = "t3"
to = "t4"

[[edges]]
from = "t4"
to = "t5"

[[edges]]
from = "t5"
to = "t6"

[[edges]]
from = "t6"
to = "t7"

[[edges]]
from = "t7"
to = "t8"

[[edges]]
from = "t8"
to = "t9"

[[edges]]
from = "t9"
to = "t10"

[[edges]]
from = "t10"
to = "sink"
