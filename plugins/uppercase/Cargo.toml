[package]
name = "wafer-uppercase"
version = "0.1.0"
edition = "2024"
description = "Uppercase transform plugin for WAFER pipeline"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.53"
wafer-plugin = { path = "../../crates/wafer-plugin" }

[profile.release]
opt-level = "s"
lto = true
