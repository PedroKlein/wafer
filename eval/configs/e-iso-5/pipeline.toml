# E-Iso-5: memory-exhaust containment shakedown.
#
# Linear pipeline: bench-source → attack (memory-exhaust) → bench-sink.
# Attack allocates 1 MiB chunks in a loop. StoreLimits cap (4 MiB) fires.

[pipeline]
name = "e-iso-5-memory-exhaust"
description = "Memory-exhaust attack in position 2 of 3-node linear pipeline"

[nodes.source]
type = "source"
kind = "bench-source"
rate = 100.0
total_messages = 12000
warmup_messages = 0
payload_size = 128

[nodes.attack]
type = "transform"
plugin = "../../../plugins/attacks/memory-exhaust/target/wasm32-wasip2/release/wafer_attack_memory_exhaust.wasm"
memory_limit = 4194304

[nodes.sink]
type = "sink"
kind = "bench-sink"
warmup_secs = 0
track_sequences = false
track_hotswap = false

[[edges]]
from = "source"
to = "attack"

[[edges]]
from = "attack"
to = "sink"
