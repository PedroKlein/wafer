# E-Perf-9 filesystem-cache cold/warm — large tier (vibration-features, ~375 KB .wasm).

[pipeline]
name = "e-perf-9-tier-large"
description = "Filesystem-cache startup measurement — large plugin (vibration-features, 375 KB)"

[nodes.source]
type = "source"
kind = "bench-source"
rate = 100.0
total_messages = 1
warmup_messages = 0
payload_size = 128

[nodes.t1]
type = "transform"
plugin = "../../../plugins/vibration-features/target/wasm32-wasip2/release/wafer_vibration_features.wasm"
config = { sample_rate = 1000.0, fft_size = 32, bands = [[0.0, 100.0], [100.0, 400.0]] }

[nodes.sink]
type = "sink"
kind = "bench-sink"
warmup_secs = 0
track_sequences = true

[[edges]]
from = "source"
to = "t1"

[[edges]]
from = "t1"
to = "sink"
