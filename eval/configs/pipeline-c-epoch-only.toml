# Passthrough with epoch metering only; fuel is disabled by omission.
#
# Ablation for E-Perf-7 metering-overhead decomposition. Fuel is set to a
# never trips. The runtime does NOT treat `fuel = 0` as unlimited; that

[pipeline]
name = "bench-passthrough-epoch-only"
description = "Passthrough with epoch metering only (fuel effectively disabled)"

[engine]
epoch_deadline = 100
epoch_tick_ms = 10

[nodes.source]
type = "source"
kind = "bench-source"
rate = 1000.0
total_messages = 90000
warmup_messages = 30000
payload_size = 128

[nodes.transform]
type = "transform"
plugin = "../../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.sink]
type = "sink"
kind = "bench-sink"
warmup_secs = 30
track_sequences = true

[[edges]]
from = "source"
to = "transform"

[[edges]]
from = "transform"
to = "sink"
