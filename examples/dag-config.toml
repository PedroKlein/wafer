# Example DAG pipeline configuration
# Linear chain: file-source → passthrough → file-sink

default_queue_capacity = 1024

[[nodes]]
id = "file-source"
node_type = "source"
[nodes.config]
path = "/tmp/input.txt"

[[nodes]]
id = "passthrough"
node_type = "transform"
[nodes.config]
plugin_path = "plugins/pass_through.wasm"

[[nodes]]
id = "file-sink"
node_type = "sink"
[nodes.config]
path = "/tmp/output.txt"

[[edges]]
from = "file-source"
to = "passthrough"

[[edges]]
from = "passthrough"
to = "file-sink"
