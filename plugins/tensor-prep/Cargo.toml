[package]
name = "wafer-tensor-prep"
version = "0.1.0"
edition = "2024"
description = "Image-to-tensor normalization plugin for WAFER pipeline (28x28 grayscale to F32)"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.53"
wafer-plugin = { path = "../../crates/wafer-plugin" }

[profile.release]
opt-level = "s"
lto = true
strip = "debuginfo"
