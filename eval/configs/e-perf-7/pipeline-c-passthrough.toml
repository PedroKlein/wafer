# E-Perf-7 metering ablation — passthrough baseline (shakedown density).
#
# All metering enabled (default engine config). Reference for comparison.
# Reduced message count for shakedown speed (5s per run).

[pipeline]
name = "e-perf-7-passthrough"
description = "Passthrough with all metering — shakedown density baseline"

[nodes.source]
type = "source"
kind = "bench-source"
rate = 1000.0
total_messages = 5000
warmup_messages = 1000
payload_size = 128

[nodes.transform]
type = "transform"
plugin = "../../../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.sink]
type = "sink"
kind = "bench-sink"
warmup_secs = 1
track_sequences = true

[[edges]]
from = "source"
to = "transform"

[[edges]]
from = "transform"
to = "sink"
