[pipeline]
name = "e-perf-payload-refinement-10kb"
description = "Candidate pass-through boundary benchmark with 10240 byte payload"

[engine]
epoch_deadline = 100
epoch_tick_ms = 10

[engine.fuel]
transform = 10000000
filter = 500000
router = 500000

[nodes.source]
type = "source"
kind = "bench-source"
rate = 1000.0
total_messages = 90000
warmup_messages = 30000
payload_size = 10240

[nodes.transform]
type = "transform"
plugin = "../../../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.sink]
type = "sink"
kind = "bench-sink"
warmup_secs = 30
track_sequences = true
track_hotswap = false

[[edges]]
from = "source"
to = "transform"

[[edges]]
from = "transform"
to = "sink"
