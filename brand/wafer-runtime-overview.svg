<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">WAFER runtime overview</title>
  <desc id="desc">Native inputs enter a single WAFER process, pass through isolated WebAssembly Transform, Filter, and Router stages connected by bounded queues, and leave through native outputs. A control plane manages the pipeline.</desc>
  <defs>
    <linearGradient id="accentFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ecb392"/>
      <stop offset="0.45" stop-color="#d9703f"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#e2d9c9"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1a1613" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <rect width="1200" height="560" rx="32" fill="#faf7f2"/>
  <rect width="1200" height="560" rx="32" fill="url(#grid)" opacity="0.7"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="64" y="70" fill="#c2410c" font-size="14" font-weight="700" letter-spacing="3">HOW WAFER RUNS A PIPELINE</text>
    <text x="64" y="112" fill="#1a1613" font-size="31" font-weight="750">One process. Isolated stages. Live evolution.</text>
    <text x="64" y="143" fill="#6b6156" font-size="16">Native adapters own transport. Wasm components own processing logic.</text>

    <g filter="url(#shadow)">
      <rect x="48" y="188" width="182" height="234" rx="22" fill="#ffffff" stroke="#e2d9c9" stroke-width="2"/>
      <rect x="72" y="214" width="54" height="7" rx="3.5" fill="#c2410c"/>
      <text x="72" y="255" fill="#1a1613" font-size="19" font-weight="700">Native input</text>
      <text x="72" y="281" fill="#6b6156" font-size="13">trusted adapters</text>

      <g transform="translate(72 310)">
        <rect width="134" height="31" rx="9" fill="#fbf6ee" stroke="#e2d9c9"/>
        <circle cx="17" cy="15.5" r="5" fill="#c2410c"/>
        <text x="31" y="20" fill="#1a1613" font-size="13" font-weight="600">MQTT</text>
      </g>
      <g transform="translate(72 350)">
        <rect width="134" height="31" rx="9" fill="#fbf6ee" stroke="#e2d9c9"/>
        <circle cx="17" cy="15.5" r="5" fill="#d9703f"/>
        <text x="31" y="20" fill="#1a1613" font-size="13" font-weight="600">HTTP / file</text>
      </g>
    </g>

    <g filter="url(#shadow)">
      <rect x="264" y="170" width="672" height="290" rx="28" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
      <rect x="286" y="190" width="151" height="28" rx="14" fill="#c2410c"/>
      <text x="361.5" y="209" fill="#faf7f2" font-size="12" font-weight="750" text-anchor="middle" letter-spacing="1.5">WAFER PROCESS</text>
      <text x="902" y="208" fill="#6b6156" font-size="12" font-weight="650" text-anchor="end" letter-spacing="1.2">TOKIO + WASMTIME</text>

      <path d="M302 315 C340 315 346 275 382 275 H812 C848 275 852 315 898 315" fill="none" stroke="url(#accentFlow)" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>

      <g transform="translate(340 238)" filter="url(#shadow)">
        <rect width="144" height="138" rx="19" fill="#fbf6ee" stroke="#e2d9c9" stroke-width="2"/>
        <rect x="18" y="18" width="45" height="8" rx="4" fill="#ecb392"/>
        <rect x="18" y="25" width="45" height="8" rx="4" fill="#d9703f"/>
        <rect x="18" y="32" width="45" height="31" rx="8" fill="#c2410c"/>
        <rect x="27" y="40" width="7" height="7" rx="2" fill="#a1350a"/>
        <rect x="38" y="40" width="7" height="7" rx="2" fill="#a1350a"/>
        <rect x="49" y="40" width="7" height="7" rx="2" fill="#a1350a"/>
        <text x="18" y="91" fill="#1a1613" font-size="18" font-weight="750">Transform</text>
        <text x="18" y="112" fill="#6b6156" font-size="12">Wasm Store 01</text>
        <text x="18" y="129" fill="#c2410c" font-size="10" font-weight="700" letter-spacing="1.1">TYPED WIT</text>
      </g>

      <g transform="translate(529 238)" filter="url(#shadow)">
        <rect width="144" height="138" rx="19" fill="#fbf6ee" stroke="#e2d9c9" stroke-width="2"/>
        <rect x="18" y="18" width="45" height="8" rx="4" fill="#ecb392"/>
        <rect x="18" y="25" width="45" height="8" rx="4" fill="#d9703f"/>
        <rect x="18" y="32" width="45" height="31" rx="8" fill="#c2410c"/>
        <rect x="27" y="40" width="7" height="7" rx="2" fill="#a1350a"/>
        <rect x="38" y="40" width="7" height="7" rx="2" fill="#a1350a"/>
        <rect x="49" y="40" width="7" height="7" rx="2" fill="#a1350a"/>
        <text x="18" y="91" fill="#1a1613" font-size="18" font-weight="750">Filter</text>
        <text x="18" y="112" fill="#6b6156" font-size="12">Wasm Store 02</text>
        <text x="18" y="129" fill="#c2410c" font-size="10" font-weight="700" letter-spacing="1.1">SANDBOXED</text>
      </g>

      <g transform="translate(718 238)" filter="url(#shadow)">
        <rect width="144" height="138" rx="19" fill="#fbf6ee" stroke="#e2d9c9" stroke-width="2"/>
        <rect x="18" y="18" width="45" height="8" rx="4" fill="#ecb392"/>
        <rect x="18" y="25" width="45" height="8" rx="4" fill="#d9703f"/>
        <rect x="18" y="32" width="45" height="31" rx="8" fill="#c2410c"/>
        <rect x="27" y="40" width="7" height="7" rx="2" fill="#a1350a"/>
        <rect x="38" y="40" width="7" height="7" rx="2" fill="#a1350a"/>
        <rect x="49" y="40" width="7" height="7" rx="2" fill="#a1350a"/>
        <text x="18" y="91" fill="#1a1613" font-size="18" font-weight="750">Router</text>
        <text x="18" y="112" fill="#6b6156" font-size="12">Wasm Store 03</text>
        <text x="18" y="129" fill="#c2410c" font-size="10" font-weight="700" letter-spacing="1.1">HOT-SWAPPABLE</text>
      </g>

      <g transform="translate(487 293)">
        <circle cx="0" cy="0" r="4" fill="#ecb392"/><circle cx="13" cy="0" r="4" fill="#d9703f"/><circle cx="26" cy="0" r="4" fill="#c2410c"/>
      </g>
      <g transform="translate(676 293)">
        <circle cx="0" cy="0" r="4" fill="#ecb392"/><circle cx="13" cy="0" r="4" fill="#d9703f"/><circle cx="26" cy="0" r="4" fill="#c2410c"/>
      </g>

      <rect x="310" y="405" width="580" height="34" rx="17" fill="#1a1613"/>
      <circle cx="334" cy="422" r="6" fill="#ecb392"/>
      <text x="350" y="427" fill="#faf7f2" font-size="12" font-weight="650">CONTROL PLANE</text>
      <text x="479" y="427" fill="#ecb392" font-size="12">hot-swap</text>
      <text x="568" y="427" fill="#ecb392" font-size="12">reconfigure</text>
      <text x="670" y="427" fill="#ecb392" font-size="12">metrics</text>
      <text x="742" y="427" fill="#ecb392" font-size="12">health</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="970" y="188" width="182" height="234" rx="22" fill="#ffffff" stroke="#e2d9c9" stroke-width="2"/>
      <rect x="994" y="214" width="54" height="7" rx="3.5" fill="#c2410c"/>
      <text x="994" y="255" fill="#1a1613" font-size="19" font-weight="700">Native output</text>
      <text x="994" y="281" fill="#6b6156" font-size="13">delivery adapters</text>

      <g transform="translate(994 310)">
        <rect width="134" height="31" rx="9" fill="#fbf6ee" stroke="#e2d9c9"/>
        <circle cx="17" cy="15.5" r="5" fill="#c2410c"/>
        <text x="31" y="20" fill="#1a1613" font-size="13" font-weight="600">alerts</text>
      </g>
      <g transform="translate(994 350)">
        <rect width="134" height="31" rx="9" fill="#fbf6ee" stroke="#e2d9c9"/>
        <circle cx="17" cy="15.5" r="5" fill="#d9703f"/>
        <text x="31" y="20" fill="#1a1613" font-size="13" font-weight="600">archive</text>
      </g>
    </g>

    <path d="M230 315 H295" stroke="#c2410c" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M936 315 H962" stroke="#c2410c" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

    <g transform="translate(264 492)">
      <rect width="190" height="38" rx="19" fill="#fbf6ee" stroke="#e2d9c9"/>
      <circle cx="23" cy="19" r="6" fill="#c2410c"/>
      <text x="39" y="24" fill="#1a1613" font-size="12" font-weight="700" letter-spacing="0.6">BOUNDED QUEUES</text>
    </g>
    <g transform="translate(474 492)">
      <rect width="210" height="38" rx="19" fill="#fbf6ee" stroke="#e2d9c9"/>
      <circle cx="23" cy="19" r="6" fill="#d9703f"/>
      <text x="39" y="24" fill="#1a1613" font-size="12" font-weight="700" letter-spacing="0.6">PER-STAGE ISOLATION</text>
    </g>
    <g transform="translate(704 492)">
      <rect width="232" height="38" rx="19" fill="#fbf6ee" stroke="#e2d9c9"/>
      <circle cx="23" cy="19" r="6" fill="#ecb392" stroke="#a1350a"/>
      <text x="39" y="24" fill="#1a1613" font-size="12" font-weight="700" letter-spacing="0.6">BETWEEN-MESSAGE SWAP</text>
    </g>
  </g>
</svg>
