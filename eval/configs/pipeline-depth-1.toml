# 1-hop pipeline: bench-source → 1× pass-through → bench-sink.
# Depth-scaling series for E-Perf-6 (memory) and E-Perf-8 (latency).

[pipeline]
name = "bench-depth-1"
description = "1 pass-through transform between bench source and bench sink"

[nodes.source]
type = "source"
kind = "bench-source"
rate = 1000.0
total_messages = 90000
warmup_messages = 30000
payload_size = 128

[nodes.t1]
type = "transform"
plugin = "../../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.sink]
type = "sink"
kind = "bench-sink"
warmup_secs = 30
track_sequences = true

[[edges]]
from = "source"
to = "t1"

[[edges]]
from = "t1"
to = "sink"
