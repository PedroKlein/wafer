[package]
name = "wafer-core"
description = "WAFER - WebAssembly Flow Execution Runtime: Core library"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["ort-download"]
http-api = ["axum", "tower-http", "prometheus-client", "sysinfo"]
# Enable CUDA for GPU acceleration on NVIDIA devices (e.g., Jetson)
# Requires CUDA toolkit installed on the target system
cuda = ["wasmtime-wasi-nn/onnx-cuda"]
# Download the prebuilt ONNX Runtime pinned by the `ort` revision (hash
# checked by ort-sys). ORT_LIB_LOCATION overrides it with a local build; turn
# the feature off to guarantee the build never reaches the network.
ort-download = ["ort/download-binaries"]
# Compile `wafer_core::testing` (channel source/sink, plugin harness) for
# consumers outside this crate's own tests and benches.
test-support = []

[dependencies]
wafer-types = { workspace = true }

# Graph
petgraph = { workspace = true }

# WASM runtime
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
wasmtime-wasi-nn = { workspace = true }
wasmtime-wasi-http = { workspace = true }
# Not used directly: wasmtime-wasi-nn links ort, and this routes ONNX Runtime's
# own log messages through tracing instead of its default stderr logger.
ort = { version = "2.0.0-rc.10", default-features = false, features = ["std", "tracing"] }

# Async runtime
tokio = { workspace = true }
tokio-util = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging/tracing
tracing = { workspace = true }

# HTTP (feature-gated)
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
prometheus-client = { workspace = true, optional = true }
sysinfo = { workspace = true, optional = true }

# Misc
uuid = { workspace = true }
bytes = { workspace = true }
blake3 = { workspace = true }
foldhash = { workspace = true }
memory-stats = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
oci-client = { workspace = true }
semver = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
dirs = { workspace = true }
futures-util = { workspace = true }
docker_credential = "1.3.2"
rumqttc = "0.25"
base64 = "0.22.1"
hdrhistogram = "7"

# HTTP source/sink
hyper = { version = "1.0", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }

[dev-dependencies]
wafer-core = { path = ".", features = ["test-support"] }
wafer-config = { path = "../wafer-config" }
tempfile = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
hyper = { version = "1.0", features = ["client"] }
tracing-subscriber = { workspace = true }
criterion = { version = "0.5", features = ["async_tokio"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["mosquitto"] }

[lints]
workspace = true

[[bench]]
name = "hot_swap"
harness = false

[[bench]]
name = "metrics"
harness = false
required-features = ["http-api"]

[[bench]]
name = "native_vs_wasm"
harness = false

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "overhead_of_memory_sampling"
harness = false
