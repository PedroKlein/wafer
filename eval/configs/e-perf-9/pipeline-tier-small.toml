# E-Perf-9 AOT cold/warm — small tier (pass-through, ~57 KB .wasm).
#
# Minimal pipeline for startup latency measurement: bench-source emits
# a small number of messages to anchor "first message received at sink".

[pipeline]
name = "e-perf-9-tier-small"
description = "AOT startup measurement — small plugin (pass-through, 57 KB)"

[nodes.source]
type = "source"
kind = "bench-source"
rate = 100.0
total_messages = 50
warmup_messages = 0
payload_size = 128

[nodes.t1]
type = "transform"
plugin = "../../../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.sink]
type = "sink"
kind = "bench-sink"
warmup_secs = 0
track_sequences = true

[[edges]]
from = "source"
to = "t1"

[[edges]]
from = "t1"
to = "sink"
