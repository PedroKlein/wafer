# File source -> pass-through -> file sink with API/metrics enabled.
# For a separate metrics listener, pass --metrics-bind 127.0.0.1:9091.

[pipeline]
name = "metrics-demo"
description = "Demo pipeline for observability testing"

[api]
enabled = true
bind = "127.0.0.1:9090"

[metrics]
enabled = true
path = "/metrics"

[dead_letter]
kind = "file"
path = "dlq.jsonl"

[nodes.source]
type = "source"
kind = "file"
path = "/tmp/wafer-input.txt"

[nodes.passthrough]
type = "transform"
plugin = "../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.sink]
type = "sink"
kind = "file"
path = "/tmp/wafer-output.txt"
append = true

[[edges]]
from = "source"
to = "passthrough"

[[edges]]
from = "passthrough"
to = "sink"
