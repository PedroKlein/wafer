# Passthrough with fuel metering only (epoch effectively disabled).
#
# Ablation for E-Perf-7 metering-overhead decomposition. Epoch is set to a
# 1 s wall-clock deadline (100× the typical per-hop latency budget) so the
# ticker never fires within a call; fuel budgets stay at their EngineConfig
# defaults. The runtime does NOT treat 0 as "unlimited" — that would trap
# on the first check — hence the large sentinel.

[pipeline]
name = "bench-passthrough-fuel-only"
description = "Passthrough with fuel metering only (epoch effectively disabled)"

[engine]
epoch_deadline = 1000000000   # 1e9 ticks ≈ unlimited under typical rates

[nodes.source]
type = "source"
kind = "bench-source"
rate = 1000.0
total_messages = 60000
warmup_messages = 30000
payload_size = 128

[nodes.transform]
type = "transform"
plugin = "../../plugins/pass-through/target/wasm32-wasip2/release/wafer_pass_through.wasm"

[nodes.sink]
type = "sink"
kind = "bench-sink"
warmup_secs = 30
track_sequences = true

[[edges]]
from = "source"
to = "transform"

[[edges]]
from = "transform"
to = "sink"
