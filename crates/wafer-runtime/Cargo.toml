[package]
name = "wafer-runtime"
description = "WAFER runtime binary with HTTP API"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "wafer"
path = "src/main.rs"

[features]
default = []
# Enable CUDA for GPU acceleration on NVIDIA devices (e.g., Jetson)
# Requires CUDA toolkit installed on the target system
cuda = ["wafer-core/cuda"]

[dependencies]
wafer-core = { workspace = true }
wafer-types = { workspace = true }

# Async runtime
tokio = { workspace = true }
tokio-util = { workspace = true }

# Serialization
serde = { workspace = true }
toml = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Logging/tracing
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# CLI
clap = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tokio-util = { workspace = true }
wafer-types = { workspace = true }
